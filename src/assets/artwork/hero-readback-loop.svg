<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1086" viewBox="0 0 2560 1086" role="img">
  <title>The readback loop</title>

  <!-- Two inks on warm cream, matching the Slop palette in
       astro-theme-slop/slop.css: gold #b97d1c, bronze #8a5c13, black #14110d.
       The subject is the loop from week 3: a clearance out, a readback back.
       -->

  <!-- This is a *background*, not a standalone diagram. The theme lays the
       page title across the middle of it under a dark scrim, so:
       - no text of its own. An earlier version labelled the arcs CLEARANCE
         and READBACK; rendered on the page those sat directly under the
         headline, unreadable and competing with it.
       - the vertical middle band is kept clear. Interest is pushed to the
         top and bottom thirds and to the left and right edges, where the
         centred title does not reach. -->

  <rect width="2560" height="1086" fill="#efe7d8"/>

  <!-- range rings behind the ground station, far left -->
  <g fill="none" stroke="#8a5c13" stroke-opacity="0.22" stroke-width="3">
    <circle cx="330" cy="600" r="150"/>
    <circle cx="330" cy="600" r="260"/>
    <circle cx="330" cy="600" r="380"/>
    <circle cx="330" cy="600" r="510"/>
  </g>

  <!-- ===== the clearance: out, gold, solid, across the top third ===== -->
  <path d="M 470 470 C 900 170, 1700 170, 2150 480"
        fill="none" stroke="#b97d1c" stroke-width="18" stroke-linecap="round"/>
  <path d="M 2150 480 l -66 -34 l 14 50 z" fill="#b97d1c"/>

  <!-- ===== the readback: back, black, dashed, across the bottom third ===== -->
  <path d="M 2140 660 C 1700 950, 900 950, 480 700"
        fill="none" stroke="#14110d" stroke-width="15" stroke-linecap="round"
        stroke-dasharray="56 28"/>
  <path d="M 480 700 l 68 22 l -16 -48 z" fill="#14110d"/>

  <!-- ===== ground station, left of the title's reach ===== -->
  <g fill="#14110d">
    <path d="M 292 720 l 18 -250 l 44 0 l 18 250 z"/>
    <rect x="266" y="720" width="132" height="26" rx="6"/>
    <path d="M 286 472 l 92 0 l -20 -54 l -52 0 z"/>
    <rect x="314" y="350" width="14" height="72"/>
  </g>
  <g fill="none" stroke="#b97d1c" stroke-width="9" stroke-linecap="round">
    <path d="M 364 376 a 74 74 0 0 1 0 60"/>
    <path d="M 390 360 a 108 108 0 0 1 0 92"/>
  </g>

  <!-- ===== the other station, right of the title's reach ===== -->
  <g fill="#14110d">
    <path d="M 2170 572 l 168 -22 l 74 22 l -74 22 l -168 -22 z"/>
    <path d="M 2254 558 l -70 -84 l 26 0 l 84 76 z"/>
    <path d="M 2254 586 l -70 84 l 26 0 l 84 -76 z"/>
    <path d="M 2338 550 l -30 -46 l 16 0 l 40 42 z"/>
  </g>

  <!-- ===== the channel along the very bottom: band-limited, and it drops
       things. The gaps are the point. ===== -->
