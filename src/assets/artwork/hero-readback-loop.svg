<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1086" viewBox="0 0 2560 1086" role="img">
  <title>The readback loop</title>

  <!-- Two inks on warm cream, matching the Slop palette in
       astro-theme-slop/slop.css: gold #b97d1c, bronze #8a5c13, black #14110d.
       The subject is the loop from week 3: a clearance out, a readback back,
       and the channel underneath that loses parts of both. -->

  <rect width="2560" height="1086" fill="#efe7d8"/>

  <!-- range rings behind the ground station -->
  <g fill="none" stroke="#8a5c13" stroke-opacity="0.18" stroke-width="3">
    <circle cx="470" cy="600" r="150"/>
    <circle cx="470" cy="600" r="250"/>
    <circle cx="470" cy="600" r="350"/>
    <circle cx="470" cy="600" r="450"/>
  </g>

  <!-- ===== the clearance: out, gold, solid ===== -->
  <path d="M 600 505 C 1000 250, 1560 250, 1960 470"
        fill="none" stroke="#b97d1c" stroke-width="16" stroke-linecap="round"/>
  <path d="M 1960 470 l -62 -30 l 14 46 z" fill="#b97d1c"/>
  <text x="1230" y="268" font-family="Consolas, 'DejaVu Sans Mono', monospace"
        font-size="44" font-weight="700" fill="#8a5c13"
        letter-spacing="10" text-anchor="middle">CLEARANCE</text>

  <!-- ===== the readback: back, black, dashed ===== -->
  <path d="M 1930 640 C 1540 850, 990 850, 620 700"
        fill="none" stroke="#14110d" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="54 26"/>
  <path d="M 620 700 l 64 24 l -18 -44 z" fill="#14110d"/>
  <text x="1230" y="905" font-family="Consolas, 'DejaVu Sans Mono', monospace"
        font-size="44" font-weight="700" fill="#14110d"
        letter-spacing="10" text-anchor="middle">READBACK</text>

  <!-- ===== ground station ===== -->
  <g fill="#14110d">
    <path d="M 430 700 l 18 -250 l 44 0 l 18 250 z"/>
    <rect x="404" y="700" width="132" height="26" rx="6"/>
    <path d="M 424 452 l 92 0 l -20 -54 l -52 0 z"/>
    <rect x="452" y="330" width="14" height="72"/>
  </g>
  <g fill="none" stroke="#b97d1c" stroke-width="9" stroke-linecap="round">
    <path d="M 502 356 a 74 74 0 0 1 0 60"/>
    <path d="M 528 340 a 108 108 0 0 1 0 92"/>
  </g>

  <!-- ===== the other station ===== -->
  <g fill="#14110d">
    <path d="M 2010 560 l 168 -22 l 74 22 l -74 22 l -168 -22 z"/>
    <path d="M 2094 546 l -70 -84 l 26 0 l 84 76 z"/>
    <path d="M 2094 574 l -70 84 l 26 0 l 84 -76 z"/>
    <path d="M 2178 538 l -30 -46 l 16 0 l 40 42 z"/>
  </g>

  <!-- ===== the channel: band-limited, and it drops things ===== -->
  <g fill="#6b6154">
    <rect x="300" y="1000" width="10" height="34" rx="4"/>
    <rect x="330" y="988" width="10" height="58" rx="4"/>
    <rect x="360" y="1006" width="10" height="22" rx="4"/>
